#runs on every push and pull request: lint + type-check the web app, lint the API
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubantu-latest
    defaults:
      run: working-directory:web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: node-version:24
          cache:npm
          cache-dependency-path:web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit

api:
  runs-on: ubantu-latest
  defaults:
    run:
      working-directory: api
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - run: pip install -r requirements.txt ruff
    - run: ruff check .
