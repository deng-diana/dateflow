# One command runs the whole stack: database, API, web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: dateflow
      POSTGRES_DB: dateflow
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      retries: 15

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://postgres:dateflow@db:5432/dateflow
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    environment:
      API_URL: http://api:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000

    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  dbdata:
